[package]
name        = "arp-broker"
version     = "0.1.0"
edition     = "2021"
description = "Action Receipt Protocol v1 broker — HTTP server for receipt submission, chain verification, and audit."

[[bin]]
name = "arp-broker"
path = "src/bin/main.rs"

[dependencies]
arp-types  = { path = "../arp-types" }
serde      = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
thiserror  = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
chrono     = { workspace = true }
tokio      = { workspace = true }
axum       = { workspace = true }
reqwest    = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = "0.3"
gix-types  = { path = "../../../GIX/crates/gix-types" }
ed25519-dalek = { workspace = true }
